<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOEL JOHNSON — THE DATA EDITORIAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Inter:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FFFFFF;
            color: #000000;
            overflow-x: hidden;
            letter-spacing: -0.01em;
            line-height: 1.8;
        }
        .vogue-serif {
            font-family: 'Playfair Display', serif;
        }
        .vogue-accent {
            color: #2D6A4F; /* Lighter Editorial Green */
        }
        .bg-vogue-sand {
            background-color: #F9F8F6;
        }
        .vogue-border {
            border-color: #000000;
        }
        .vogue-pink {
            color: #2D6A4F; /* Updated for visibility */
        }
        .bg-vogue-pink {
            background-color: #2D6A4F;
        }
        .border-vogue-pink {
            border-color: #2D6A4F;
        }
        ::selection {
            background: #2D6A4F;
            color: white;
        }
        .full-bleed {
            width: 100vw;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        /* Logo Styling */
        .jj-logo {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            display: inline-flex;
            align-items: baseline;
            font-size: 2rem;
            line-height: 1;
        }
        .jj-logo .j1 { color: #000000; }
        .jj-logo .j2 { color: #2D6A4F; }
        .jj-logo .dot { color: #000000; font-size: 0.8em; }

        .drop-cap::first-letter {
            float: left;
            font-family: 'Playfair Display', serif;
            font-size: 6rem;
            line-height: 1;
            font-weight: 900;
            padding-right: 0.75rem;
            color: #2D6A4F;
            text-transform: uppercase;
        }

        h1, h2, h3, h4 {
            line-height: 1.1;
        }
        p {
            margin-bottom: 1.5rem;
        }
    </style>
<script type="importmap">

}

</head>

</html>
